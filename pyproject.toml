[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-agent-kit"
version = "0.1.0"
description = "Stay eligible as a FLOP testnet agent: verify official endpoints, keep a settled-session ledger, pace your faucet, never self-deal."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
flopkit = "flopkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flopkit = ["rules.json"]
